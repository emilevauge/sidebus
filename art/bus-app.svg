  <!-- pare-chocs -->
  <path fill="#1B2647" d="M278 724H746A22 22 0 0 1 768 746V754A22 22 0 0 1 746 776H278A22 22 0 0 1 256 754V746A22 22 0 0 1 278 724Z"/>
